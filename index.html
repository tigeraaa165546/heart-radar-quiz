  .footnote{text-align:center;font-size:12px;color:#c99dac;margin-top:14px;line-height:1.7}
  .deco{margin-top:22px;font-size:13px;color:#d9a8bc;text-align:center;line-height:1.9}

  /* ---------- 答题 ---------- */
  .bar{height:8px;background:#f6cfdd;border-radius:99px;overflow:hidden;margin:10px 0 6px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .3s}
  .count{text-align:right;font-size:12px;color:var(--sub);margin-bottom:10px}
  .q{background:var(--card);border-radius:18px;padding:20px 16px;font-size:17px;font-weight:700;line-height:1.6;

  .opt{background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:14px 15px;font-size:15px;
    line-height:1.55;text-align:left;cursor:pointer;transition:.15s;color:var(--ink)}

  .result{text-align:center;padding-top:22px}

  .again{margin-top:10px}

  ["顺其自然，慢慢升温","H"],
  ["说开就开，别让人猜谜","I"],
  ["从志同道合的共同爱好开始","J"],
  ["从一个说不清的心动瞬间开始","C"]],
 ["别人突然对你特别好，你会：",
  ["先记着，看看是不是常态","H"],
  ["立刻警觉：TA是不是图什么","D"],
  ["开始分析TA为什么突然对我好","F"],
  ["开心，但怀疑是自己自作多情","G"]],
 ["你觉得自己读人的水平：",
  ["很准，所以我朋友不多但都是精挑的","A"],
  ["对别人的心意特别迟钝，全靠别人点醒","D"],
  ["看人：某类人我特别懂，其他抓瞎","J"],
  ["不敢下结论，总觉得还得多看看","H"]],
 ["朋友让你评价TA的暧昧对象，你：",
  ["判断一般都应验","A"],
  ["分析得头头是道，但常和结局相反","F"],
  ["说的是感觉，往往被当事人后来验证","E"],
  ["劝TA慢慢看，时间会给答案","H"]],
 ["「TA今天对我特别好」，你的解读：",
  ["肯定有事要宣布，或者有求于人","A"],
  ["人总有心情好的时候，没多想","B"],
  ["开始琢磨是不是对我有意思","C"],
  ["先想TA最近经历了什么","E"]],
 ["暧昧期最让你上头的是：",
  ["TA的忽冷忽热，每次都让我猜半天","C"],
  ["一起做事时的默契","J"],
  ["一切按计划推进，确认感很足","I"],
  ["那种「快了」的直觉","E"]],
 ["用一个词形容你的心动雷达：",
  ["精准","A"],
  ["迟钝","B"],
  ["发散","C"],
  ["挑人","J"]]
];

let idx = 0, score = {};
const $ = id => document.getElementById(id);

function start(){
  idx = 0; score = {};
  $("home").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  render();
}
function render(){
  const q = QS[idx];
  $("qnum").textContent = "第 " + (idx+1) + " 题";
  $("qtext").textContent = q[0];
  $("cnow").textContent = idx+1;
  $("pbar").style.width = (idx/32*100) + "%";
  const box = $("opts"); box.innerHTML = "";
  q.slice(1).forEach(([text,key])=>{
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = text;
    b.onclick = ()=>pick(key);
    box.appendChild(b);
  });
  window.scrollTo(0,0);
}
function pick(key){
  score[key] = (score[key]||0) + 1;
  idx++;
  if(idx < QS.length) render(); else show();
}
function show(){
  $("quiz").classList.add("hidden");
  $("res").classList.remove("hidden");
  const order = ["A","B","C","D","E","F","G","H","I","J"];
  let best = order[0];
  order.forEach(k=>{ if((score[k]||0) > (score[best]||0)) best = k; });
  const t = TYPES[best];
  $("remoji").textContent = t.e;
  $("rname").textContent = t.n;
  $("rtag").textContent = "—— " + t.t + " ——";
  $("rbody").textContent = t.b;
  $("rstep").textContent = t.s;
  $("rwarn").textContent = t.w;
  const sorted = order.map(k=>[k,score[k]||0]).sort((a,b)=>b[1]-a[1]);
  const second = TYPES[sorted[1][0]];
  $("rstat").textContent = "次高体质：" + second.n + "（" + second.t + "）· 32 题答完，" + (score[best]||0) + " 题指向这个体质。雷达没有绝对的好坏，准的人输在不敢，钝的人赢在不内耗。";
  $("res").dataset.text = "我在「测一测，你的心动雷达准不准」里测出了【" + t.n + "】："
    + t.t + "。" + t.s + " 来测测你的雷达 →";
  window.scrollTo(0,0);
}
function copyRes(){
  const text = $("res").dataset.text;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>alert("已复制，去评论区报体质吧 👀"));
  }else{
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    alert("已复制，去评论区报体质吧 👀");
  }
}
</script>
